<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Panda Racing</title>
  </head>
  <body>
    <div id="loading"><div class="spinner"></div> Loading...</div>
    <canvas id="app"></canvas>
    <div class="touch-controls" aria-label="Comandi macchina">
      <div class="tc-cluster tc-steer">
        <button class="tc-btn" type="button" data-control="steerLeft" aria-label="Sterza a sinistra">&#8592;</button>
        <button class="tc-btn" type="button" data-control="steerRight" aria-label="Sterza a destra">&#8594;</button>
      </div>
      <div class="tc-cluster tc-drive">
        <button class="tc-btn" type="button" data-control="throttle" aria-label="Accelera">&#8593;</button>
        <button class="tc-btn" type="button" data-control="reverse" aria-label="Retromarcia o freno">&#8595;</button>
        <button class="tc-btn tc-wide" type="button" data-control="handbrake" aria-label="Freno a mano">Freno</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
